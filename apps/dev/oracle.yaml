apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-db-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nasruddinkhan/gitops.git
    targetRevision: main
    path: environments/dev/oracle
  destination:
    server: https://kubernetes.default.svc
    namespace: nasruddinkhan786-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
